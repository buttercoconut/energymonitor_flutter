name: energy_monitor
description: A Flutter app for energy monitoring.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ">=2.19.0 <3.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.5
  provider: ^6.0.5
  charts_flutter: ^0.12.0
  flutter_local_notifications: ^9.8.0
  shared_preferences: ^2.0.15
  json_annotation: ^4.8.0
  flutter_secure_storage: ^8.0.0
  flutter_dotenv: ^5.0.2
  intl: ^0.18.0
  flutter_svg: ^2.0.5
  cupertino_icons: ^1.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.6.1
flutter:
  uses-material-design: true
  assets:
    - assets/
